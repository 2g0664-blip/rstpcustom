name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Kivy Buildozer Docker
        run: |
          docker run --rm -v "$PWD":/home/user/hostcwd kivy/buildozer-action:latest \
            bash -c "cd /home/user/hostcwd && buildozer android debug"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RTSP-Camera-APK
          path: bin/*.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          tag_name: v1.0.${{ github.run_number }}
          name: RTSP Camera v1.0.${{ github.run_number }}
          body: |
            ## RTSP Camera App - Download APK Below
            
            Custom RTSP/RTP-JPEG decoder for Android
            
            **Install:**
            1. Download APK
            2. Enable Unknown Sources
            3. Install
            4. Connect to 192.168.1.1
            5. Tap Connect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
